name: Installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  # write: a v* tag publishes a GitHub release with the installer.
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # A v* tag sets the version (v0.1.0-beta.5 → DcsVoiceCom-Setup-0.1.0-beta.5.exe); a manual run uses Directory.Build.props.
      - shell: pwsh
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1 -Version "$env:TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DcsVoiceCom-Setup
          path: dist/DcsVoiceCom-Setup-*.exe
      # A v* tag publishes a release named after the tag, with notes from docs/releases/<tag>.md.
      # Tags with a "-" (v0.1.0-beta.1) are marked as pre-releases.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = "docs/releases/$env:TAG.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          $exe = Get-ChildItem dist/DcsVoiceCom-Setup-*.exe | Select-Object -First 1
          $flags = @()
          if ($env:TAG.Contains("-")) { $flags += "--prerelease" }
          gh release create $env:TAG $exe.FullName --title "DCS VoiceCom $($env:TAG.TrimStart('v'))" --notes-file $notes --verify-tag @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
