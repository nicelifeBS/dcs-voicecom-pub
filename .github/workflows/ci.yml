name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
        with:
          repository: nicelifeBS/dcs-voicecom-voicelines
          ssh-key: ${{ secrets.VOICELINES_DEPLOY_KEY }}
          path: private-clips
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
        env:
          DCS_REAL_CLIPS: ${{ github.workspace }}/private-clips/recordings/take_01

